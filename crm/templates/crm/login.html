<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - Shiraz Decor CRM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm border-0 col-md-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark"><i class="bi bi-palette-fill text-warning me-2"></i>Shiraz Decor</h2>
            <p class="text-muted">تسجيل الدخول إلى نظام CRM</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger p-2 text-center">اسم المستخدم أو كلمة السر غير صحيحة!</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">اسم المستخدم:</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">كلمة السر:</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة السر" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2"><i class="bi bi-box-arrow-in-right me-1"></i>دخول</button>
        </form>
    </div>
</body>
</html>
