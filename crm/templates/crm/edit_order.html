<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل الطلبية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-5">
    <div class="container col-md-6 card p-4 shadow-sm">
        <h3 class="mb-3">تعديل الطلبية رقم #{{ order.id }}</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label>الزبون:</label>{{ form.customer }}</div>
            <div class="mb-3"><label>التفاصيل:</label>{{ form.product_details }}</div>
            <div class="mb-3"><label>المبلغ:</label>{{ form.total_price }}</div>
            <div class="mb-3"><label>الحالة:</label>{{ form.status }}</div>
            <button type="submit" class="btn btn-success">حفظ التغييرات</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</body>
</html>
