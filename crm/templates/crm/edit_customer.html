<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات الزبون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-5">
    <div class="container col-md-6 card p-4 shadow-sm">
        <h3 class="mb-3">تعديل بيانات الزبون: {{ customer.full_name }}</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">الاسم الكامل:</label>{{ form.full_name }}</div>
            <div class="mb-3"><label class="form-label">رقم الهاتف:</label>{{ form.phone }}</div>
            <div class="mb-3"><label class="form-label">حالة الزبون:</label>{{ form.status }}</div>
            <div class="mb-3"><label class="form-label">الاهتمامات:</label>{{ form.interest }}</div>
            <button type="submit" class="btn btn-success">حفظ التغييرات</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</body>
</html>
